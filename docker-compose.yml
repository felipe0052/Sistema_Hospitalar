services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: intranet-decos-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: oracle123
      APP_USER: decos
      APP_USER_PASSWORD: decos123
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./database/init:/container-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 25

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: intranet-decos-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: oracle+oracledb://decos:decos123@oracle:1521/?service_name=FREEPDB1
      JWT_SECRET: intranet-decos-jwt-secret-key-2026-corporativo-seguro
      JWT_EXPIRES_MINUTES: 480
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      UPLOAD_DIR: /app/uploads
      UPLOAD_MAX_MB: 20
      STORAGE_BACKEND: local
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      oracle:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000/api/v1
        VITE_USE_MOCKS: "false"
    container_name: intranet-decos-frontend
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  oracle-data:
  uploads-data:
