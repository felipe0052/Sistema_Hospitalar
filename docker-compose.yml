services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: intranet-decos-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: oracle123
      APP_USER: decos
      APP_USER_PASSWORD: decos123
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./database/init:/container-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      retries: 20

volumes:
  oracle-data:
