<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Decós Hospital</title>
    <meta
      name="description"
      content="Portal institucional da Decós Hospital: gestão de expedientes, comunicados, treinamentos e indicadores da rede hospitalar."
    />
    <script>
      // Define o tema antes do React montar, evitando flash de tela clara/escura.
      (function () {
        try {
          var stored = localStorage.getItem("decos-theme");
          var theme = stored === "light" || stored === "dark"
            ? stored
            : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
