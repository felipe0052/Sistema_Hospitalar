<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/src/imports/Decos_Hospital_Simbolo_Transparente_v2.png" />
    <script>
      // Aplica o tema antes da primeira pintura para evitar flash.
      // Padrão obrigatório: Light Mode quando não houver preferência salva.
      try {
        var t = localStorage.getItem("decos.theme");
        if (t !== "dark" && t !== "light") t = "light";
        document.documentElement.dataset.theme = t;
        if (t === "dark") {
          document.documentElement.classList.add("dark");
        } else {
          document.documentElement.classList.remove("dark");
        }
      } catch (e) {}
    </script>
    <title>Decós Hospital — Intranet Corporativa</title>
    <meta
      name="description"
      content="Portal institucional da Decós Hospital: gestão de expedientes, comunicados, treinamentos e indicadores da rede hospitalar."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
